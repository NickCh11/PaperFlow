name: Offline language runtime
on:
  push:
    branches: [feature/offline-translator]
    paths: ['translation/native/**', 'tools/ci/build_language_runtime.sh', '.github/workflows/language-runtime.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            translation/native/target
          key: offline-runtime-v2-${{ matrix.abi }}-${{ hashFiles('translation/native/Cargo.toml', 'translation/native/Cargo.lock', 'tools/ci/build_language_runtime.sh') }}
          restore-keys: |
            offline-runtime-v2-${{ matrix.abi }}-
            offline-runtime-v1-${{ matrix.abi }}-
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang libclang-dev pkg-config
          sdkmanager 'ndk;28.0.13004108'
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Compile the pinned offline-translator runtime
        run: bash tools/ci/build_language_runtime.sh '${{ matrix.abi }}'
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            translation/native/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: language-runtime-${{ matrix.abi }}
          path: |
            translation/src/main/jniLibs/${{ matrix.abi }}/
            translation/native/Cargo.lock
          if-no-files-found: error
          retention-days: 14
