name: Offline language runtime
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Rust unit-test fixture before installing toolchains
        if: matrix.abi == 'x86_64'
        run: test -s translation/native/testdata/fonts_api28.xml
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: binaries
        with:
          path: |
            translation/src/main/jniLibs/${{ matrix.abi }}
            build/native-tests/${{ matrix.abi }}
          key: native-artifacts-v1-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('translation/native/**', 'tools/ci/build_language_runtime.sh', 'tools/ci/collect_native_tests.py', '.github/workflows/language-runtime.yml') }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        if: steps.binaries.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: cache
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            translation/native/target
          key: offline-runtime-v2-${{ matrix.abi }}-${{ hashFiles('translation/native/Cargo.toml', 'translation/native/Cargo.lock', 'tools/ci/build_language_runtime.sh') }}
          restore-keys: |
            offline-runtime-v2-${{ matrix.abi }}-
            offline-runtime-v1-${{ matrix.abi }}-
      - name: Install native toolchain
        if: steps.binaries.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang libclang-dev pkg-config
          sdkmanager 'ndk;28.0.13004108'
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Compile the pinned offline-translator runtime
        if: steps.binaries.outputs.cache-hit != 'true'
        run: bash tools/ci/build_language_runtime.sh '${{ matrix.abi }}'
      - name: Compile Rust unit tests for the Android emulator
        if: matrix.abi == 'x86_64' && steps.binaries.outputs.cache-hit != 'true'
        run: bash tools/ci/build_language_runtime.sh x86_64 tests
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: success() && steps.binaries.outputs.cache-hit != 'true'
        with:
          path: |
            translation/src/main/jniLibs/${{ matrix.abi }}
            build/native-tests/${{ matrix.abi }}
          key: ${{ steps.binaries.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.abi == 'x86_64'
        with:
          name: native-tests-x86_64
          path: build/native-tests/x86_64/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && steps.binaries.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            translation/native/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: language-runtime-${{ matrix.abi }}
          path: |
            translation/src/main/jniLibs/${{ matrix.abi }}/
            translation/native/Cargo.lock
          if-no-files-found: error
          retention-days: 3
