name: Translation PR checks

on:
  pull_request:
    paths:
      - 'app/src/main/res/**'
      - 'app/src/main/java/com/example/myapplication/UiText*.java'
      - 'app/src/main/java/com/example/myapplication/AppLanguage.java'
      - 'tools/localization/**'
      - '.github/workflows/translations.yml'
  push:
    paths:
      - 'app/src/main/res/**'
      - 'tools/localization/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the validator against valid and broken PR examples
        run: python3 -m unittest discover -s tools/localization -p 'test_*.py' -v
      - name: Validate resource keys, placeholders and locale registration
        run: python3 tools/localization/check_translations.py
