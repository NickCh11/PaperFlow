name: Android PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, master, feature/offline-translator]
  merge_group:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run both emulators, native tests and all release APK variants
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Unrelated labels skip validation and must never replace its running or pending run.
  group: android-ci-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-validation' && format('ignored-label-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-validation'
    permissions:
      contents: read
      # Manual dispatch resolves the open PR for the selected branch.
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      full: ${{ steps.plan.outputs.full }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      pr_branch: ${{ steps.plan.outputs.pr_branch }}
      pr_base: ${{ steps.plan.outputs.pr_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/ci_plan.py

  language-runtime:
    needs: [plan, checks]
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/language-runtime.yml

  checks:
    needs: plan
    name: Unit tests, lint and translations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install pinned Android tools
        run: bash tools/ci/install_android_tools.sh 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Translation validator regression tests
        run: python3 -m unittest discover -s tools/localization -p 'test_*.py' -v
      - name: Validate translations
        run: python3 tools/localization/check_translations.py
      - name: Validate pinned model release tag
        run: python3 tools/ci/model_distribution.py
      - name: Validate app release version
        run: python3 tools/ci/release_android.py version
      - name: CI tooling regression tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: JVM tests and lint across modules
        run: bash gradlew testDebugUnitTest lintDebug coverageReport -PpaperflowAbi=x86_64 -PpaperflowCoverage=true --stacktrace
      - name: Verify complete JVM test reports
        run: |
          python3 tools/ci/check_test_results.py app/build/test-results/testDebugUnitTest app/src/test/java
          python3 tools/ci/check_test_results.py scanengine/build/test-results/testDebugUnitTest scanengine/src/test/java
          python3 tools/ci/check_test_results.py translation/build/test-results/testDebugUnitTest translation/src/test/java
      - name: Preserve compiled scanner inputs from this exact revision
        run: |
          mkdir -p build
          find app/build scanengine/build translation/build -type f \( -name '*.class' -o -name '*.exec' -o -name '*.xml' -o -name 'R.jar' \) -print0 | tar --null -T - -czf build/sonar-inputs.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-inputs
          path: build/sonar-inputs.tgz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: static-check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 3

  build:
    needs: language-runtime
    name: Build ${{ matrix.abi }} debug and release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore compiled offline language runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: language-runtime-*
          path: translation
          merge-multiple: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: bash tools/ci/install_android_tools.sh
      - name: Build all modules and both variants
        env:
          ABI: ${{ matrix.abi }}
        run: |
          if [ "$ABI" = all ]; then
            bash gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          else
            bash gradlew :app:assembleDebug :app:assembleRelease -PpaperflowAbi="$ABI" --stacktrace
          fi
      - name: Verify native engines and ELF architecture
        run: |
          python3 tools/ci/check_apk.py app/build/outputs/apk/debug/app-debug.apk ${{ matrix.abi }}
          python3 tools/ci/check_apk.py app/build/outputs/apk/release/app-release-unsigned.apk ${{ matrix.abi }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apks-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  device-tests:
    needs: language-runtime
    name: Device tests API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ['29', '37.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore compiled offline language runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: language-runtime-*
          path: translation
          merge-multiple: true
      - name: Restore Android Rust test executable
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-tests-x86_64
          path: build/native-tests/x86_64
      - name: Restore instrumented JNI objects for API 29 coverage
        if: matrix.api == '29'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-coverage-x86_64
          path: build/native-coverage/x86_64
      - name: Use the separate instrumented library only in the coverage test APK
        if: matrix.api == '29'
        run: |
          cp build/native-coverage/x86_64/libpaperflow_runtime.so translation/src/main/jniLibs/x86_64/libpaperflow_runtime.so
      - name: Free disk space for Android system images
        if: runner.environment == 'github-hosted'
        run: |
          # This disposable Ubuntu runner does not need .NET, Haskell or its
          # preinstalled Android images/NDKs; install only our pinned SDK below.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: bash tools/ci/install_android_tools.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test application
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PpaperflowAbi=x86_64 -PpaperflowCoverage=true --stacktrace
      - name: Download and verify public language fixtures
        run: python3 tools/ci/prepare_models.py --all-ocr
      - name: Install emulator image with download retries
        env:
          API: ${{ matrix.api }}
        run: |
          # The emulator action prepends cmdline-tools/latest to PATH. Ubuntu's
          # preinstalled copy is too old to write valid android-37.0 AVD metadata.
          test -x "$ANDROID_HOME/cmdline-tools/22.0/bin/avdmanager"
          sudo rm -rf -- "$ANDROID_HOME/cmdline-tools/latest"
          sudo ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          for attempt in 1 2 3; do
            if sdkmanager "system-images;android-${API};google_apis;x86_64"; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          exit 1
      - name: Run complete instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: ${{ matrix.api == '29' && 2048 || 4096 }}
          heap-size: 512
          disk-size: 8G
          disable-animations: true
          pre-emulator-launch-script: grep -Fx 'target=android-${{ matrix.api }}' "$ANDROID_AVD_HOME/test.ini"
          emulator-options: -no-window -no-snapshot -gpu swiftshader -feature GLESDynamicVersion -noaudio -no-boot-anim -camera-back emulated
          script: |
            bash tools/ci/run_native_tests.sh
            if [ '${{ matrix.api }}' = 29 ]; then python3 tools/ci/native_coverage.py run-unit; fi
            bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PpaperflowAbi=x86_64 -PpaperflowCoverage=true --stacktrace
            python3 tools/ci/prepare_models.py --all-ocr --install
            # Keep the app data until the native profiles have been collected below.
            bash gradlew :app:connectedDebugAndroidTest -PpaperflowAbi=x86_64 -PpaperflowCoverage=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.ci=true -Pandroid.testInstrumentationRunnerArguments.nativeCoverage=${{ matrix.api == '29' }} --stacktrace
            python3 tools/ci/check_test_results.py app/build/outputs/androidTest-results/connected app/src/androidTest/java
            if [ '${{ matrix.api }}' = 29 ]; then python3 tools/ci/native_coverage.py collect-app; fi
            mkdir -p build/ci-device-reports
            cp -R app/build/outputs/androidTest-results/connected build/ci-device-reports/full-suite
            mkdir -p build/ci-device-coverage/full-suite
            cp -R app/build/outputs/code_coverage/. build/ci-device-coverage/full-suite/
            adb shell wm size 640x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            bash gradlew :app:connectedDebugAndroidTest -PpaperflowAbi=x86_64 -PpaperflowCoverage=true -Pandroid.testInstrumentationRunnerArguments.ci=true -Pandroid.testInstrumentationRunnerArguments.class=com.example.myapplication.AppearanceTest --stacktrace
            python3 tools/ci/check_test_results.py app/build/outputs/androidTest-results/connected
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/ci-device-reports/
            build/native-test-results/
          retention-days: 3

      - name: Preserve instrumentation coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-coverage-api-${{ matrix.api }}
          path: build/ci-device-coverage/
          if-no-files-found: error
          retention-days: 3

  sonar:
    needs: [plan, checks, device-tests]
    if: always() && needs.plan.result == 'success' && needs.checks.result == 'success'
    uses: ./.github/workflows/sonarqube-cloud.yml
    with:
      # Keep successful current-run coverage when another API fails; pr-gate
      # below still requires every emulator to pass full validation.
      device-coverage: ${{ needs.plan.outputs.full == 'true' }}
      pr-number: ${{ needs.plan.outputs.pr_number }}
      pr-branch: ${{ needs.plan.outputs.pr_branch }}
      pr-base: ${{ needs.plan.outputs.pr_base }}
    secrets: inherit

  pr-gate:
    name: PR gate
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, checks, build, device-tests, language-runtime, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RUNTIME: ${{ needs.language-runtime.result }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          DEVICES: ${{ needs.device-tests.result }}
          SONAR: ${{ needs.sonar.result }}
          FULL: ${{ needs.plan.outputs.full }}
          PLAN: ${{ needs.plan.result }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          test "$SONAR" = success
          if [ "$FULL" = true ]; then
            test "$RUNTIME" = success
            test "$BUILD" = success
            test "$DEVICES" = success
            echo 'Full validation completed for this revision.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Fast checks only. Full device/ABI acceptance has not been performed. Request full validation before release.' >> "$GITHUB_STEP_SUMMARY"
          fi
