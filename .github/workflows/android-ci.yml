name: Android PR checks

on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Private model archives cannot serve anonymous Android downloads.
  PAPERFLOW_MODEL_REPOSITORY: ${{ vars.MODEL_MIRROR_REPOSITORY || '' }}

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, lint and translations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Translation validator regression tests
        run: python3 -m unittest discover -s tools/localization -p 'test_*.py' -v
      - name: Validate translations
        run: python3 tools/localization/check_translations.py
      - name: Validate pinned model release tag
        run: python3 tools/ci/model_distribution.py
      - name: CI tooling regression tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: JVM tests and lint across modules
        run: bash gradlew testDebugUnitTest lintDebug -PpaperflowAbi=x86_64 --stacktrace
      - name: Verify complete JVM test reports
        run: python3 tools/ci/check_test_results.py app/build/test-results/testDebugUnitTest app/src/test/java
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: static-check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  build:
    name: Build ${{ matrix.abi }} debug and release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build all modules and both variants
        env:
          ABI: ${{ matrix.abi }}
        run: |
          if [ "$ABI" = all ]; then
            bash gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          else
            bash gradlew :app:assembleDebug :app:assembleRelease -PpaperflowAbi="$ABI" --stacktrace
          fi
      - name: Verify native engines and ELF architecture
        run: |
          python3 tools/ci/check_apk.py app/build/outputs/apk/debug/app-debug.apk ${{ matrix.abi }}
          python3 tools/ci/check_apk.py app/build/outputs/apk/release/app-release-unsigned.apk ${{ matrix.abi }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apks-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  device-tests:
    name: Device tests API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: ['29', '37.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free disk space for Android system images
        if: runner.environment == 'github-hosted'
        run: |
          # This disposable Ubuntu runner does not need .NET, Haskell or its
          # preinstalled Android images/NDKs; install only our pinned SDK below.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test application
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PpaperflowAbi=x86_64 --stacktrace
      - name: Download and verify public language fixtures
        run: python3 tools/ci/prepare_models.py
      - name: Run complete instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back emulated
          script: |
            python3 tools/ci/prepare_models.py --install
            bash gradlew :app:connectedDebugAndroidTest -PpaperflowAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.ci=true --stacktrace
            python3 tools/ci/check_test_results.py app/build/outputs/androidTest-results/connected app/src/androidTest/java
            mkdir -p build/ci-device-reports
            cp -R app/build/outputs/androidTest-results/connected build/ci-device-reports/full-suite
            adb shell wm size 640x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            bash gradlew :app:connectedDebugAndroidTest -PpaperflowAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.ci=true -Pandroid.testInstrumentationRunnerArguments.class=com.example.myapplication.AppearanceTest --stacktrace
            python3 tools/ci/check_test_results.py app/build/outputs/androidTest-results/connected
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/ci-device-reports/
          retention-days: 7

  pr-gate:
    name: PR gate
    if: always()
    needs: [checks, build, device-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          DEVICES: ${{ needs.device-tests.result }}
        run: |
          test "$CHECKS" = success
          test "$BUILD" = success
          test "$DEVICES" = success
