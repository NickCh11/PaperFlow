name: Import verified source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Restore verified source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          parts = [{"offset":0,"size":2400000,"sha":"da418d41230111316cd651625149fd1df7a76c27"},{"offset":2400000,"size":2400000,"sha":"c0eecd0d0735bbbb32fef6ecf26b11818c4fca08"},{"offset":4800000,"size":2400000,"sha":"afd6100ec8d7bacb47c720294765ae41d1c932d6"},{"offset":7200000,"size":2400000,"sha":"7172bcf4665a5ba96dbbc680e347f811483f7dc3"},{"offset":9600000,"size":2400000,"sha":"6207b09b4131e9f7d7df8522b59263dbe92e3d56"},{"offset":12000000,"size":2400000,"sha":"fb4efb1847fdf3c641cc99ddf73ef6ff71b06004"},{"offset":14400000,"size":2400000,"sha":"e2f445c2f9288afe37e9243e117f7697afdf5a89"},{"offset":16800000,"size":2400000,"sha":"e9d2505a596716b6183ecc023b810c9fde062078"},{"offset":19200000,"size":2400000,"sha":"a075953d52318cea119432f70bfd9ec0f16545ab"},{"offset":21600000,"size":2400000,"sha":"087b00015af4356082684682ccc952d09ccdf891"},{"offset":24000000,"size":2400000,"sha":"331bdc942e4c6b1eeecaa4920cdc1be299ac50fb"},{"offset":26400000,"size":2400000,"sha":"6930fa843f82ce72c3e2cd1b5db8c6d2e5aa6573"},{"offset":28800000,"size":2400000,"sha":"853a9e27cafc6d91ab83ac06d9357515b6fcbf14"},{"offset":31200000,"size":2400000,"sha":"3f7ed03201defde588e7ec9c03ae266c42006bfe"},{"offset":33600000,"size":2400000,"sha":"e7164fbfd2e57c7f077036fa9fdd8423d7c974cc"},{"offset":36000000,"size":2400000,"sha":"93236a4b2315108810e08d9d476730352c780ae4"},{"offset":38400000,"size":2400000,"sha":"10f1f78d2833da56493cd14f1d42e08b93e17ff3"},{"offset":40800000,"size":2400000,"sha":"4512c783d055b3c2637e077476821c857ce62373"},{"offset":43200000,"size":2400000,"sha":"7d21535dfa66f611ec6b3f2525cd4eda967103ec"},{"offset":45600000,"size":2400000,"sha":"63cb75e5318efe3825357c7aafc107fb9a59ff7a"},{"offset":48000000,"size":1011085,"sha":"d5915928ab1efb5224821743ab707b3745c1168d"}]
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source.bundle"
          digest = hashlib.sha256()
          with target.open("wb") as output:
              for part in parts:
                  url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs/" + part["sha"]
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "PaperFlow-Source-Import"})
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = base64.b64decode(json.load(response)["content"])
                  expected = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
                  if len(raw) != part["size"] or expected != part["sha"]:
                      raise ValueError("Source part integrity mismatch")
                  output.write(raw)
                  digest.update(raw)
          if digest.hexdigest() != "c5ecce883fac6b3ca39193ecfd5a6b407306d259462bb42cb2d265510dfd7edf":
              raise ValueError("Source bundle integrity mismatch")
          print("Verified source bundle:", target.stat().st_size, "bytes")
          PY
      - name: Import source without changing workflow permissions
        run: |
          OLD=$(git rev-parse HEAD)
          git -c pack.threads=1 fetch --no-tags "$RUNNER_TEMP/source.bundle" main
          SOURCE=$(git rev-parse FETCH_HEAD)
          test "$(git rev-parse "$SOURCE^{tree}")" = d08d09320b3a9d57ac93237956caf72838a0028b
          git read-tree "$SOURCE^{tree}"
          git reset "$OLD" -- .github/workflows
          TREE=$(git write-tree)
          git config user.name "NickCh11"
          git config user.email "58607503+NickCh11@users.noreply.github.com"
          COMMIT=$(git commit-tree "$TREE" -p "$OLD" -m "Import verified PaperFlow source")
          git update-ref refs/heads/main "$COMMIT" "$OLD"
          git push origin refs/heads/main:refs/heads/main
